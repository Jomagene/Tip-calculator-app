<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet" />
    <script src="./scripts/script.js" defer></script>

    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body class="flex column items-center">
    <header>
      <img src="./images/logo.svg" alt="Logo splitter" />
    </header>
    <main class="flex items-center">
      <form class="flex column">
        <fieldset>
          <label for="bill">Bill</label>
          <input type="number" name="bill" id="bill" />
        </fieldset>
        <fieldset>
          <label class="choice-title">
            <span>Select Tip %</span>
          </label>
          <div class="percent-inputs">
            <div>
              <input type="radio" name="percentage" id="five" />
              <label for="five">5%</label>
            </div>
            <div>
              <input type="radio" name="percentage" id="ten" />
              <label for="ten">10%</label>
            </div>
            <div>
              <input type="radio" name="percentage" id="fifteen" />
              <label for="fifteen">15%</label>
            </div>
            <div>
              <input type="radio" name="percentage" id="twenty-five" />
              <label for="twenty-five">25%</label>
            </div>
            <div>
              <input type="radio" name="percentage" id="fifty" />
              <label for="fifty">50%</label>
            </div>
            <div class="custom">
              <input
                type="number"
                name="percentage"
                id="custom"
                placeholder="Custom" />
            </div>
          </div>
        </fieldset>
        <fieldset>
          <label for="">Number of People</label>
          <input type="number" name="" id="" />
        </fieldset>
      </form>

      <section class="flex column">
        <div class="results flex column">
          <div class="result flex justify-between items-center">
            <div>
              <p>Tip Amount</p>
              <span> / person</span>
            </div>
            <h1>$4.27</h1>
          </div>
          <div class="result flex justify-between items-center">
            <div>
              <p>Total</p>
              <span> / person</span>
            </div>
            <h1>$32.79</h1>
          </div>
        </div>
        <button>RESET</button>
      </section>
    </main>
  </body>
</html>
